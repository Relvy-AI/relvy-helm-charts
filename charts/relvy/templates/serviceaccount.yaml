{{- if .Values.config.serviceAccount.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "relvy.serviceAccountName" . }}
  labels:
    {{- include "relvy.labels" . | nindent 4 }}
  {{- with .Values.config.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

